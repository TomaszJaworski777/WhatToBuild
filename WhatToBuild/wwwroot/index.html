<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WhatToBuild</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="app.css" />
</head>
<body>
    <div class="shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark"></span>
                <span class="brand-name">WhatToBuild</span>
            </div>
            <div class="meta">
                <label class="horizon" for="horizon" title="How big a core to build toward. The plan picks the best core of this many items plus shoes; once it stands, every later buy is simply the best item at that moment.">
                    <span class="horizon-end">Core</span>
                    <input type="range" id="horizon" min="1" max="5" step="1" value="3" />
                    <span id="horizon-label" class="horizon-label">3 items + shoes</span>
                </label>
                <div class="focus">
                    <button type="button" id="focus-toggle" class="focus-toggle" aria-expanded="false" aria-controls="focus-panel" disabled
                            title="The weights the plan scores builds with: constant damage, burst, uptime and survival.">
                        <svg class="focus-mini" viewBox="0 0 200 200" aria-hidden="true">
                            <polygon points="100,12 188,100 100,188 12,100" />
                            <polygon id="focus-mini-shape" class="focus-mini-shape" points="100,100 100,100 100,100 100,100" />
                        </svg>
                        <span class="horizon-end">Focus</span>
                        <span id="focus-label" class="horizon-label focus-label">waiting for a game</span>
                    </button>
                    <div id="focus-panel" class="focus-panel" hidden>
                        <div class="focus-head">
                            <span>Build focus</span>
                            <span id="focus-champion" class="focus-champion"></span>
                        </div>
                        <svg id="focus-shape" class="focus-shape" viewBox="-54 -18 308 240" aria-hidden="true">
                            <g id="focus-rings"></g>
                            <polygon id="focus-default" class="focus-default" points="" />
                            <polygon id="focus-area" class="focus-area" points="" />
                            <g id="focus-handles"></g>
                            <g id="focus-axes"></g>
                        </svg>
                        <div id="focus-inputs" class="focus-inputs"></div>
                        <div class="focus-actions">
                            <button type="button" id="focus-reset" class="focus-reset">Back to default</button>
                            <span class="focus-hint">Only the balance between the four matters. Dashed: champion default.</span>
                        </div>
                    </div>
                </div>
                <span id="patch" class="patch"></span>
                <span id="status" class="status status-connecting">Connecting</span>
            </div>
        </header>

        <section id="waiting" class="waiting" hidden>
            <div class="waiting-ring"></div>
            <h1>Waiting for a game</h1>
            <p>The scoreboard appears as soon as a Summoner's Rift game is running.</p>
        </section>

        <main id="game" hidden>
            <section class="scoreboard">
                <div class="side side-order">
                    <span id="order-kills" class="kills">0</span>
                    <div id="order-objectives" class="objectives"></div>
                </div>
                <div id="clock" class="clock">00:00</div>
                <div class="side side-chaos">
                    <div id="chaos-objectives" class="objectives"></div>
                    <span id="chaos-kills" class="kills">0</span>
                </div>
            </section>

            <section class="teams">
                <article id="team-order" class="team team-order"></article>
                <article id="team-chaos" class="team team-chaos"></article>
            </section>

            <section id="build" class="build" hidden></section>

            <p id="unknown" class="unknown" hidden></p>
        </main>
    </div>

    <div id="tip" class="tip" hidden></div>

    <script src="lib/signalr.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
